    - 内审方案与年度内审计划
    - 审核组组成与审核员资格证明
    - 审核检查表与抽样依据
    - 不符合项报告与不符合项确认记录
    - 内审报告与结论及跟踪关闭证据
    on_site_evidence:
    - 抽查内审报告，确认覆盖范围与抽样是否合理
    - 访谈被审核部门确认审核员独立性与专业性
    - 查看不符合项从开具到关闭的证据链
    - 核对上年度内审发现的重复发生情况
    typical_nc:
    - 内审由本部门负责人自审自己
    - 检查表照抄标准条款，无针对过程的内容
    - 不符合项描述笼统，关闭无证据
    - 发现重复问题未做原因分析，仍按原结论关闭
