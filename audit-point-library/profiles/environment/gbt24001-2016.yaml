    audit_question: 最高管理者是否对 EMS 作出可见的承诺，并亲自参与体系策划、评审与资源决策？
    written_evidence:
    - 最高管理者环境方针签署件
    - 管理评审会议记录及签到
    - EMS 策划与资源决策会议纪要
    - 最高管理者参加环境事务的影像与通知记录
    - 授权与任命文件
    on_site_evidence:
    - 访谈一线员工"最高管理者何时到现场、谈过什么环境事项"
    - 查看管理评审会议室布置与投屏内容
    - 核对最高管理者是否到过投诉与应急处置现场
    - 查看员工访谈时是否随时能找到管理者
    typical_nc:
    - 承诺仅停留在方针文字与会议签名，无具体参与行为
    - 环境职责全部下放给环境部门，最高管理者以不知情为由免于责任
    - 资源需求由环保专员争取而非管理者决策
    - 出现重大环境事件后无管理者层面的追责
