  points:
  - point_key: '8.1'
    audit_question: 组织是否对满足 EMS 要求的过程实施策划、实施、控制与评价，并对运行中的偏离与变化及时作出响应和处置？
    written_evidence:
    - 运行策划与控制清单（过程、准则、控制措施、责任人）
    - 运行控制程序与受控作业文件及参数限值表
    - 运行阶段环境因素识别程序、识别记录表单与评价准则
    - 监视与测量的点位、方法、频次及校准记录
    - 变更管理程序、变更申请与变更前影响评价及变更后验证记录
    - 运行策划输出与体系其他条款（风险机遇、合规义务、环境目标）的对应矩阵
    - 外包过程的控制要求与评价记录
    - 偏离与异常的登记、处置及有效性验证记录
    on_site_evidence:
    - 现场观察关键过程是否按受控文件操作并留下可追溯记录
    - 核对实际运行参数是否在控制限值内且超限有处置记录
    - 抽查运行阶段环境因素识别表单的填报频次与真实性，核实工艺或设备变更后是否重新识别
    - 查看车间公示的环境因素看板与识别清单是否一致
    - 抽查一项变更从申请、评审、批准到文件与培训同步更新的全过程
    - 访谈一线人员是否知道本岗位需控制的参数、偏离上报路径与频次
    - 核实外包作业是否纳入现场监督与评价范围
    typical_nc:
    - 运行控制文件齐备但现场不按其执行，控制要求停留在纸面
    - 环境因素识别仅在体系建立阶段做一次，运行阶段无持续识别机制与记录
    - 监视测量频次低于法规或风险要求，数据缺失或超限无处置
    - 变更未走程序先实施后补手续，新风险未纳入清单且文件参数未同步
    - 外包过程只签合同不评价不监督
    - 运行偏离无登记无响应，异常长期无人知
    - 策划输出与运行控制各自为政，未建立可追溯的对应关系
