    audit_question: 组织是否建立、实施、保持并持续改进了 EMS，并把体系与业务过程和战略方向整合而非游离？
    written_evidence:
    - EMS 手册或体系文件总纲
    - 过程地图与 EMS 过程清单
    - 体系与组织战略、业务计划的对应关系说明
    - 体系有效性评价记录
    - 年度体系运行总结
    on_site_evidence:
    - 询问体系主管，体系如何进入部门日常工作而非独立于生产
    - 查看体系文件在车间的可获得性与版本控制
    - 核查业务计划与年度环境目标同源证据
    - 抽查体系会议纪要的实际议题
    typical_nc:
    - 体系文件与现场实际两张皮，现场执行的是另一套做法
    - 体系仅覆盖环境部门而不覆盖研发、采购等过程
    - 手册两年未更新而引用文件已废止
    - 管理层以手册代替体系策划
