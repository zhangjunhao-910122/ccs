      侧重审核方案的实施（年度审核计划的制定与调整、审核组组成与分工、审核实施记录与证据获取、审核报告的编制与发布、不符合项的报告与闭环、审核结果的输入与跟踪）。作为引导条款，其本身不设独立审核点，本基线关注的整体问题仍为：组织是否按策划的时间间隔实施内部审核，审核是否覆盖体系全部过程与条款并由具备能力且独立于受审核活动的审核员实施？
