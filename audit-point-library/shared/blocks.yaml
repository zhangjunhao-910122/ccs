# 共享条款公共块
# 对应 GitHub Issue #2（规格 S1）。三体系共用的审核骨架条款。
# 块内定义共通审核点；画像引用时按 inheritance 继承，并允许 override 覆盖同名 point_key。

schema_version: 1

blocks:
  - id: pdca-process-approach
    title: 过程方法与体系边界（共通骨架）
    applies_to: [quality, environment, ohs]
    inheritance: extend
    clauses:
      - clause_no: "4.4"
        title: 组织的过程方法
        points:
          - point_key: "4.4"
            audit_question: 组织如何确定过程的输入输出、顺序和相互作用、准则和方法、资源、职责权限、风险和机遇、绩效指标与改进方式？
            written_evidence:
              - 过程清单与过程关系图
              - 过程说明（准则、方法、绩效指标、负责人）
              - 绩效监视数据
            on_site_evidence:
              - 选一条实际过程做端到端追踪，验证过程图与实际流转一致
            typical_nc:
              - 过程清单与实际作业不符
              - 过程无明确准则与绩效指标
              - 过程之间的关系未描述，接口失控

  - id: common-documented-information
    title: 成文信息控制（共通骨架）
    applies_to: [quality, environment, ohs]
    inheritance: extend
    clauses:
      - clause_no: "7.5"
        title: 成文信息
        points:
          - point_key: "7.5"
            audit_question: 组织的成文信息如何识别、创建、更新与控制？文件的批准、版本、发放、检索、保护与保留期限如何落实？
            written_evidence:
              - 文件控制程序
              - 文件清单与版本发放记录
              - 外来文件控制清单
            on_site_evidence:
              - 现场抽查在用文件版本是否为受控版本
              - 核对记录的保存期限与处置记录
            typical_nc:
              - 现场使用作废版本文件
              - 外来文件未评审即使用
              - 电子文件修改无痕、无审批记录

  - id: common-audit-and-review
    title: 内部审核与管理评审（共通骨架）
    applies_to: [quality, environment, ohs]
    inheritance: extend
    clauses:
      - clause_no: "9.2"
        title: 内部审核
        points:
          - point_key: "9.2"
            audit_question: 组织如何策划、建立、实施和保持内部审核方案？审核员是否独立于被审核活动？审核发现是否按期闭环？
            written_evidence:
              - 内部审核方案与年度审核计划
              - 内部审核报告
              - 不符合项与纠正措施记录
            on_site_evidence:
              - 核查审核员独立性声明与能力评价记录
              - 抽查内部审核发现是否真正闭环
            typical_nc:
              - 审核员审核自己的工作
              - 内部审核流于形式，无不符合项或全部为轻微
              - 内部审核发现未转化为改进
      - clause_no: "9.3"
        title: 管理评审
        points:
          - point_key: "9.3"
            audit_question: 管理评审是否按策划的间隔举行？输入输出是否完整？评审结论与决定是否得到落实并传达？
            written_evidence:
              - 管理评审计划与通知
              - 管理评审记录与报告
              - 评审输出的落实跟踪记录
            on_site_evidence:
              - 核对评审输入是否覆盖全部规定输入项
              - 抽查评审结论的落实证据
            typical_nc:
              - 评审未按期举行
              - 输入缺失或输出仅为复述会议内容
              - 评审决定无人跟踪

  - id: common-nonconformity
    title: 不符合与纠正措施（共通骨架）
    applies_to: [quality, environment, ohs]
    inheritance: extend
    clauses:
      - clause_no: "10.2"
        title: 不符合与纠正措施
        points:
          - point_key: "10.2"
            audit_question: 组织如何识别、评价不符合并采取纠正措施？纠正措施是否消除了原因、防止再发生？有效性是否得到验证？
            written_evidence:
              - 不符合项台账
              - 纠正措施记录与原因分析
              - 有效性验证记录
            on_site_evidence:
              - 抽查不符合项的原因分析是否触及根本原因
              - 验证同类问题是否在其他过程重复发生
            typical_nc:
              - 以纠正代替纠正措施，未消除原因
              - 有效性验证无客观证据
              - 同类不符合重复发生未升级处理

  - id: common-planning
    title: 风险机遇与目标策划（共通骨架）
    applies_to: [quality, environment, ohs]
    inheritance: extend
    clauses:
      - clause_no: "6.1"
        title: 应对风险和机遇的措施
        points:
          - point_key: "6.1"
            audit_question: 组织如何识别与体系目标相关的机会与风险？如何策划应对措施并评价其有效性？如何融入业务过程？
            written_evidence:
              - 风险与机遇识别清单
              - 应对措施策划记录
              - 措施有效性评价记录
            on_site_evidence:
              - 抽查措施是否融入过程策划而非独立台账
              - 评价有效性结论是否有客观数据支撑
            typical_nc:
              - 风险清单与业务实际脱节
              - 措施未融入过程策划
              - 有效性评价无证据
