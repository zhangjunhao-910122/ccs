# 编号别名与无效编号路由
# 对应 GitHub Issue #2（规格 S1）。来源：docs/research/iso9001-clause-audit-baseline.md 第 1.4 节
# 别名必须归一到同一张条款卡，否则同一要求会被重复取证或漏取。
# invalid_numbers 命中即判为无效编号并提示审核员，不得静默忽略。

schema_version: 1

profiles:
  qms-gbt19001-2016:
    aliases:
      - clause_no: "8.6"
        aliases: ["8.7"]
        note: 部分公开资料与部分译本用 8.7 指"不合格输出的控制"，主键用 8.6，命中 8.7 路由到同一张条款卡
      - clause_no: "10.2"
        aliases: []
        note: 需求文档中常见的"8.7 纠正措施"实为 10.2，不建 8.7 节点，避免同一要求两处取证
      - clause_no: "8.4.1"
        aliases: []
        note: 8.4.1 是总则，控制类型与程度取 8.4.2，供方信息取 8.4.3
      - clause_no: "9.1"
        aliases: []
        note: 2008 版遗留的"8.7 数据分析"对应 2015 版 9.1.3 分析和评价
    invalid_numbers:
      - number: "8.2.5"
        reason: ISO 9001:2015 的 8.2 只有 4 个子条款，不存在 8.2.5
      - number: "8.2.6"
        reason: ISO 9001:2015 的 8.2 只有 4 个子条款，不存在 8.2.6
      - number: "8.1.4"
        reason: ISO 9001:2015 的 8.1 只有 3 个子条款（8.1.1~8.1.3），不存在 8.1.4
      - number: "8.1.5"
        reason: 同上
      - number: "8.1.6"
        reason: 同上
      - number: "6.2.1"
        reason: ISO 9001:2015 的 6.2 没有子条款；6.2.1/6.2.2 是 ISO 9001:2026 的编号（版本口径冲突，待 #16 R4 裁定）
      - number: "6.2.2"
        reason: 同上
      - number: "5.5.1"
        reason: 2015 版已取消第 5 章的 5.4 沟通 / 5.5 质量管理体系文件（分别移入 7.4 / 7.5），5.5.1 是 2008 版残留编号
    notes:
      - "7.5 与 8.1 在 GB/T 19001-2016 中确有编号子条款（7.5.1~7.5.3、8.1.1~8.1.3），已由条款树表达，不作别名处理"
      - "基线把 7.5 / 8.1 表述为「内容块」且称 8.1 有四个块，与 2015 版结构不符，待 #16 R4 裁定"
