# 编号别名与无效编号路由
# 对应 GitHub Issue #2（规格 S1）。来源：docs/iso-audit/research/iso9001-clause-audit-baseline.md 第 1.4 节
# 别名必须归一到同一张条款卡，否则同一要求会被重复取证或漏取。
# invalid_numbers 命中即判为无效编号并提示审核员，不得静默忽略。
# 版本口径：条款号与层级按 ISO 9001:2015 / ISO 14001:2015 / ISO 45001:2018 官方预览版目录一手核定；
#   凡在现行版本中已被真实条款占用的编号（如 8.6、8.7），一律不作别名，只在 notes 里写明历史沿革。

schema_version: 1

profiles:
  qms-gbt19001-2016:
    aliases:
      - clause_no: "7.5"
        aliases: ["5.5", "5.5.1", "5.5.2"]
        note: "2008 版第 5.5「质量管理体系文件」移入 2015 版 7.5「成文信息」；命中 5.5/5.5.1/5.5.2 路由到 7.5"
      - clause_no: "7.4"
        aliases: ["5.4", "5.4.1", "5.4.2"]
        note: "2008 版第 5.4「沟通」移入 2015 版 7.4「沟通」"
      - clause_no: "6.2"
        aliases: ["6.2.1", "6.2.2"]
        note: "历史版本编号（2008 版 6.2 设有质量目标与策划两个编号子条款）；2015 版与 2026 版 6.2 均无编号子条款，一律路由到 6.2"
      - clause_no: "8.1"
        aliases: ["8.1.1", "8.1.2", "8.1.3", "8.1.4", "8.1.5", "8.1.6"]
        note: "2008 版 8.1 设有 6 个编号子条款；2015 版与 2026 版 8.1 均无编号子条款，一律路由到 8.1"
      - clause_no: "10.2"
        aliases: ["10.2.1", "10.2.2"]
        note: "历史版本编号；2015 版与 2026 版 10.2 均无编号子条款，一律路由到 10.2"
      - clause_no: "4.4"
        aliases: ["4.4.1", "4.4.2"]
        note: "2008 版 4.4 设有质量管理体系文件与质量手册两个编号子条款；2015 版与 2026 版 4.4 均无编号子条款，一律路由到 4.4"
      - clause_no: "8.4"
        aliases: ["8.4.4", "8.4.5"]
        note: "历史版本编号；2015 版与 2026 版 8.4 均只设 8.4.1～8.4.3，超出者路由到 8.4"
      - clause_no: "8.6"
        aliases: ["8.6.1", "8.6.2"]
        note: "历史译本常见的 8.6 拆分写法；2015 版 8.6「产品的放行」无编号子条款，路由到 8.6"
    invalid_numbers:
      - number: "8.2.5"
        reason: "ISO 9001:2015 的 8.2 只有 8.2.1～8.2.4 四个子条款，不存在 8.2.5"
      - number: "8.2.6"
        reason: "ISO 9001:2015 的 8.2 只有 8.2.1～8.2.4 四个子条款，不存在 8.2.6"
    notes:
      - "8.6「产品的放行」与 8.7「不合格输出的控制」在 2015 版中都是真实条款，不得互为别名；历史译本混用时按标题语义判定"
      - "2008 版 8.7「测量、分析和改进」对应 2015 版 9.1「监视、测量、分析和评价」，但编号 8.7 已被 2015 版占用，冲突时以 9.1 语义判定并提示审核员"
      - "2015 版 7.5 确有 7.5.1～7.5.3；4.4、6.1、6.2、8.1、9.2、10.2 均无编号子条款（ISO 9001:2015 官方目录一手核定，见 docs/research/standard-version-watch.md §5）"

  ems-gbt24001-2016:
    aliases: []
    invalid_numbers: []
    notes:
      - "ISO 14001:2015 的 4.1～10.3 编号体系完整且与 2004 版差异集中在措辞而非编号，本基线未出现跨版本编号，无需登记别名"
      - "条款号与层级按 ISO 14001:2015 官方预览版目录一手核定；中文标题与正文措辞待 #5 I8 以正版核定"
      - "ISO 14001:2004 与 2015 版的跨版本编号映射尚未取得，故别名表保持空（不造数据）；取得后由 #16 R4 核定并回填"

  ohs-gbt45001-2020:
    aliases: []
    invalid_numbers: []
    notes:
      - "本体系基线只使用 GB/T 45001-2020 / ISO 45001:2018 自身编号，未出现 OHSAS 18001 或其他版本编号，无需登记别名"
      - "6.1.2.1～6.1.2.3 与 8.1.4.1～8.1.4.3 层级见 ISO 45001:2018 官方目录（一手 PDF 计数确认），GB/T 45001-2020 官方目次未列，须以国标正文核定"
      - "OHSAS 18001 与 ISO 45001:2018 的跨版本编号映射尚未取得，故别名表保持空（不造数据）；取得后由 #16 R4 核定并回填"
