# 标准条款树 —— 按「标准版本」组织的条款层级结构
# 对应 GitHub Issue #2（规格 S1）。条款树是客观结构（标准目录），审核点表是判断性内容，两者必须分开。
# 本文件为公开标准目录重建，非标准正文复制；条款号与标题的准确性由 #16 R4 / #5 I8 核定。
#
# 关键设计：审核点表的 covers（这张表覆盖哪些条款单元）只能来自条款树，
# 不能从表格标题的自然语言括注里猜 —— 括注是描述，不是结构化事实。

