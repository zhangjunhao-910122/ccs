# 职业健康安全管理体系条款树 —— GB/T 45001-2020 / ISO 45001:2018
# 对应 GitHub Issue #2（规格 S1）。条款树是客观结构（标准目录），审核点表是判断性内容，两者必须分开。
#
# 条款号与层级来源（均为一手目录来源，已逐条核对）：
#   - ISO 45001:2018 官方目录：ANSI Webstore 官方预览版目录（.research-tmp/ansi_45001.pdf，第 2-3 页）
#   - 层级复核：Compare-9.15-14.15-45.18 三标准条款对照表 45001 栏（.research-tmp/cmp1.pdf）
# 中文条款标题按 GB/T 45001-2020 通行译法填写，未经正版正文逐条核定，由 #5 I8 核定后回填。
#
# 关键设计：审核点表的 covers（这张表覆盖哪些条款单元）只能来自本文件，
# 不能从表格标题的自然语言括注里猜 —— 括注是描述，不是结构化事实。

