# 环境管理体系条款树 —— GB/T 24001-2016 / ISO 14001:2015
# 对应 GitHub Issue #2（规格 S1）。条款树是客观结构（标准目录），审核点表是判断性内容，两者必须分开。
# 条款号与层级来源：ISO 14001:2015 官方预览版目录（.research-tmp/iso14001_preview.pdf 第 5-6 页），为一手目录来源。
# 中文条款标题按 GB/T 24001-2016 通行译法填写，未经正版正文逐条核定，由 #5 I8 核定后回填。
#
# 关键设计：审核点表的 covers（这张表覆盖哪些条款单元）只能来自本文件，
# 不能从表格标题的自然语言括注里猜 —— 括注是描述，不是结构化事实。

