# 第一阶段审核报告（机构成果模板，Issue #19）
# 机构中立模板：本文件不含任何真实机构表单号、机构名或机构内部信息。
schema_version: 1
family_id: F09
name: 第一阶段审核报告
short_name: 一阶段报告
aliases:
- f09_stage1_audit_report
source_of_list: docs/spec/output-formats.md §11.1 第 9 类
form_number:
  placeholder: '{{表单编号}}'
  form_name_placeholder: '{{表单名称}}'
  registry_ref: FN-UICC-MS
  note: 本仓库只登记编号形态与来源出处，绝不写任何真实机构表单号
fields:
- key: task_id
  label: 任务标识
  required: true
  placeholder: '{{任务标识}}'
  source: 任务记录
  dictionary_ref: '9.1'
- key: agency
  label: 认证机构名称
  required: true
  placeholder: '{{认证机构名称}}'
  source: 机构档案（#20）
  dictionary_ref: '9.1'
- key: client
  label: 受审核方名称
  required: true
  placeholder: '{{受审核方名称}}'
  source: 委托人档案
  dictionary_ref: '9.1'
- key: audit_type
  label: 审核类型
  required: true
  placeholder: '{{审核类型}}'
  source: '#4 状态机 N1～N6'
  dictionary_ref: '9.1'
- key: criteria
  label: 审核准则
  required: true
  placeholder: '{{审核准则}}'
  source: 依据库快照
  dictionary_ref: '9.1'
- key: scope
  label: 认证范围
  required: true
  placeholder: '{{认证范围}}'
  source: 审核方案
  dictionary_ref: '9.1'
- key: audit_time
  label: 审核时间
  required: true
  placeholder: '{{审核时间}}'
  source: '引用 #21 计算结果'
  dictionary_ref: '9.1'
- key: lead
  label: 审核组长姓名
  required: true
  placeholder: '{{审核组长姓名}}'
  source: 审核组信息
  dictionary_ref: '9.1'
- key: auditors
  label: 审核员姓名
  required: true
  placeholder: '{{审核员姓名}}'
  source: 审核组信息
  dictionary_ref: '9.1'
- key: date
  label: 日期
  required: false
  placeholder: '{{日期}}'
  source: 任务时间
  dictionary_ref: '9.1'
- key: version
  label: 版本号
  required: true
  placeholder: '{{版本号}}'
  source: 成果元数据
  dictionary_ref: '9.1'
- key: state
  label: 成果状态
  required: true
  placeholder: '{{成果状态}}'
  source: 成果元数据
  dictionary_ref: '9.1'
- key: form_no
  label: 表单编号
  required: true
  placeholder: '{{表单编号}}'
  source: 模板层扩展占位符
  dictionary_ref: T
- key: form_name
  label: 表单名称
  required: true
  placeholder: '{{表单名称}}'
  source: 模板层扩展占位符
  dictionary_ref: T
- key: signer
  label: 签字人姓名
  required: false
  placeholder: '{{签字人姓名}}'
  source: 人工录入
  dictionary_ref: '9.1'
- key: sign_date
  label: 签字日期
  required: false
  placeholder: '{{签字日期}}'
  source: 人工录入
  dictionary_ref: '9.1'
sections:
- order: 1
  id: header
  title: 表头
  fields:
  - agency
  - form_no
  - form_name
  - task_id
  - client
  - version
  - state
- order: 2
  id: doc_review
  title: 文件与现场一致性评审
  fields:
  - criteria
  - scope
  - version
- order: 3
  id: effectiveness
  title: 内审与管理评审有效性评审
  fields:
  - audit_time
  - version
- order: 4
  id: sign
  title: 签署栏
  fields:
  - lead
  - signer
  - sign_date
artifacts:
- artifact_base: 审核报告
  artifact_format: docx
  artifact_form: 报告类成果
  relation: 审核报告 N2 分支（§11.1 第 9 类）
- artifact_base: 过程底稿
  artifact_format: json
  artifact_form: 过程底稿
  relation: judgements 与 report_refs（N2 节点）
note: 不得出现「运行有效」「持续满足要求」类结论（#9 §9 N2）
sample_body: |-
  {{表单名称}}（表单编号：{{表单编号}}）
  {{认证机构名称}}　任务标识：{{任务标识}}　受审核方：{{受审核方名称}}
  审核类型：{{审核类型}}　审核准则：{{审核准则}}
  一、文件与现场一致性：{{认证范围}}
  二、内审与管理评审有效性：{{审核时间}}
  审核组：{{审核组长姓名}}、{{审核员姓名}}　日期：{{日期}}　版本：{{版本号}}　成果态：{{成果状态}}
