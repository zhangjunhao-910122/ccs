# 首末次会议签到表（机构成果模板，Issue #19）
# 机构中立模板：本文件不含任何真实机构表单号、机构名或机构内部信息。
schema_version: 1
family_id: F04
name: 首末次会议签到表
short_name: 签到表
aliases:
- f04_opening_closing_meeting_signin
source_of_list: docs/spec/output-formats.md §11.1 第 4 类
form_number:
  placeholder: '{{表单编号}}'
  form_name_placeholder: '{{表单名称}}'
  registry_ref: FN-UICC-MS
  note: 本仓库只登记编号形态与来源出处，绝不写任何真实机构表单号
fields:
- key: task_id
  label: 任务标识
  required: true
  placeholder: '{{任务标识}}'
  source: 任务记录
  dictionary_ref: '9.1'
- key: agency
  label: 认证机构名称
  required: true
  placeholder: '{{认证机构名称}}'
  source: 机构档案（#20）
  dictionary_ref: '9.1'
- key: client
  label: 受审核方名称
  required: true
  placeholder: '{{受审核方名称}}'
  source: 委托人档案
  dictionary_ref: '9.1'
- key: date
  label: 日期
  required: false
  placeholder: '{{日期}}'
  source: 任务时间
  dictionary_ref: '9.1'
- key: site
  label: 场所
  required: false
  placeholder: '{{场所}}'
  source: 审核方案
  dictionary_ref: '9.1'
- key: signer
  label: 签字人姓名
  required: false
  placeholder: '{{签字人姓名}}'
  source: 人工录入
  dictionary_ref: '9.1'
- key: signer_title
  label: 签字人职务
  required: false
  placeholder: '{{签字人职务}}'
  source: 人工录入
  dictionary_ref: '9.1'
- key: sign_date
  label: 签字日期
  required: false
  placeholder: '{{签字日期}}'
  source: 人工录入
  dictionary_ref: '9.1'
- key: version
  label: 版本号
  required: true
  placeholder: '{{版本号}}'
  source: 成果元数据
  dictionary_ref: '9.1'
- key: form_no
  label: 表单编号
  required: true
  placeholder: '{{表单编号}}'
  source: 模板层扩展占位符
  dictionary_ref: T
- key: form_name
  label: 表单名称
  required: true
  placeholder: '{{表单名称}}'
  source: 模板层扩展占位符
  dictionary_ref: T
sections:
- order: 1
  id: header
  title: 表头
  fields:
  - agency
  - form_no
  - form_name
  - task_id
  - client
  - date
  - site
- order: 2
  id: signin
  title: 签名栏
  fields:
  - signer
  - signer_title
  - sign_date
artifacts:
- artifact_base: 审核报告
  artifact_format: docx
  artifact_form: 报告类成果
  relation: 审核报告附件（§11.1 第 4 类）；签名栏留空，生成待签版本（§10）
note: 签名栏必须留空并标注「（待签）」；工具不代签、不仿制签章（§10.2）
sample_body: |-
  {{表单名称}}（表单编号：{{表单编号}}）
  {{认证机构名称}}　任务标识：{{任务标识}}　日期：{{日期}}　地点：{{场所}}
  签名栏（待签）：{{签字人姓名}}　{{签字人职务}}　{{签字日期}}
