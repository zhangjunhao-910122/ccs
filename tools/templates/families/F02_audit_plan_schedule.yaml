# 审核计划表（机构成果模板，Issue #19）
# 机构中立模板：本文件不含任何真实机构表单号、机构名或机构内部信息。
schema_version: 1
family_id: F02
name: 审核计划表
short_name: 计划表
aliases:
- f02_audit_plan_schedule
source_of_list: docs/spec/output-formats.md §11.1 第 2 类
form_number:
  placeholder: '{{表单编号}}'
  form_name_placeholder: '{{表单名称}}'
  registry_ref: FN-UICC-MS
  note: 本仓库只登记编号形态与来源出处，绝不写任何真实机构表单号
fields:
- key: task_id
  label: 任务标识
  required: true
  placeholder: '{{任务标识}}'
  source: 任务记录
  dictionary_ref: '9.1'
- key: agency
  label: 认证机构名称
  required: true
  placeholder: '{{认证机构名称}}'
  source: 机构档案（#20）
  dictionary_ref: '9.1'
- key: lead
  label: 审核组长姓名
  required: true
  placeholder: '{{审核组长姓名}}'
  source: 审核组信息
  dictionary_ref: '9.1'
- key: auditors
  label: 审核员姓名
  required: true
  placeholder: '{{审核员姓名}}'
  source: 审核组信息
  dictionary_ref: '9.1'
- key: dept
  label: 部门
  required: false
  placeholder: '{{部门}}'
  source: 审核方案
  dictionary_ref: '9.1'
- key: site
  label: 场所
  required: false
  placeholder: '{{场所}}'
  source: 审核方案
  dictionary_ref: '9.1'
- key: audit_time
  label: 审核时间
  required: true
  placeholder: '{{审核时间}}'
  source: '引用 #21 计算结果'
  dictionary_ref: '9.1'
- key: date_range
  label: 起止日期
  required: false
  placeholder: '{{起止日期}}'
  source: 审核方案
  dictionary_ref: '9.1'
- key: contract_no
  label: 合同编号
  required: false
  placeholder: '{{合同编号}}'
  source: 合同记录
  dictionary_ref: '9.1'
- key: prof_code
  label: 专业代码
  required: false
  placeholder: '{{专业代码}}'
  source: '附录 A（引用 #21 计算结果）'
  dictionary_ref: '9.1'
- key: version
  label: 版本号
  required: true
  placeholder: '{{版本号}}'
  source: 成果元数据
  dictionary_ref: '9.1'
- key: form_no
  label: 表单编号
  required: true
  placeholder: '{{表单编号}}'
  source: 模板层扩展占位符
  dictionary_ref: T
- key: form_name
  label: 表单名称
  required: true
  placeholder: '{{表单名称}}'
  source: 模板层扩展占位符
  dictionary_ref: T
- key: signer
  label: 签字人姓名
  required: false
  placeholder: '{{签字人姓名}}'
  source: 人工录入
  dictionary_ref: '9.1'
- key: sign_date
  label: 签字日期
  required: false
  placeholder: '{{签字日期}}'
  source: 人工录入
  dictionary_ref: '9.1'
sections:
- order: 1
  id: header
  title: 表头
  fields:
  - agency
  - form_no
  - form_name
  - task_id
  - version
  - contract_no
- order: 2
  id: schedule
  title: 逐日安排
  fields:
  - date_range
  - dept
  - site
  - audit_time
  - auditors
  - prof_code
- order: 3
  id: sign
  title: 签署栏
  fields:
  - lead
  - signer
  - sign_date
artifacts:
- artifact_base: 审查表
  artifact_format: xlsx
  artifact_form: 表格类成果
  relation: 分工维度：审核员分工与逐日安排落到审查表分工列
sample_body: |-
  {{表单名称}}（表单编号：{{表单编号}}）
  {{认证机构名称}}　任务标识：{{任务标识}}　版本：{{版本号}}
  一、审核组分工：组长 {{审核组长姓名}}；审核员 {{审核员姓名}}（{{审核职务}}）
  二、逐日安排：{{起止日期}}；部门 {{部门}}；场所 {{场所}}；审核时间 {{审核时间}}
  三、签署：{{签字人姓名}}　{{签字日期}}
