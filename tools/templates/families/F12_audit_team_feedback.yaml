# 审核组工作情况反馈表（机构成果模板，Issue #19）
# 机构中立模板：本文件不含任何真实机构表单号、机构名或机构内部信息。
schema_version: 1
family_id: F12
name: 审核组工作情况反馈表
short_name: 反馈表
aliases:
- f12_audit_team_feedback
source_of_list: docs/spec/output-formats.md §11.1 第 12 类
form_number:
  placeholder: '{{表单编号}}'
  form_name_placeholder: '{{表单名称}}'
  registry_ref: FN-UICC-MS
  note: 本仓库只登记编号形态与来源出处，绝不写任何真实机构表单号
fields:
- key: task_id
  label: 任务标识
  required: true
  placeholder: '{{任务标识}}'
  source: 任务记录
  dictionary_ref: '9.1'
- key: agency
  label: 认证机构名称
  required: true
  placeholder: '{{认证机构名称}}'
  source: 机构档案（#20）
  dictionary_ref: '9.1'
- key: client
  label: 受审核方名称
  required: true
  placeholder: '{{受审核方名称}}'
  source: 委托人档案
  dictionary_ref: '9.1'
- key: audit_type
  label: 审核类型
  required: true
  placeholder: '{{审核类型}}'
  source: '#4 状态机 N1～N6'
  dictionary_ref: '9.1'
- key: audit_time
  label: 审核时间
  required: true
  placeholder: '{{审核时间}}'
  source: '引用 #21 计算结果'
  dictionary_ref: '9.1'
- key: lead
  label: 审核组长姓名
  required: true
  placeholder: '{{审核组长姓名}}'
  source: 审核组信息
  dictionary_ref: '9.1'
- key: auditors
  label: 审核员姓名
  required: true
  placeholder: '{{审核员姓名}}'
  source: 审核组信息
  dictionary_ref: '9.1'
- key: client_rep
  label: 委托方代表姓名
  required: false
  placeholder: '{{委托方代表姓名}}'
  source: 委托人档案
  dictionary_ref: '9.1'
- key: contact
  label: 联系人姓名
  required: false
  placeholder: '{{联系人姓名}}'
  source: 委托人档案
  dictionary_ref: '9.1'
- key: date
  label: 日期
  required: false
  placeholder: '{{日期}}'
  source: 任务时间
  dictionary_ref: '9.1'
- key: version
  label: 版本号
  required: true
  placeholder: '{{版本号}}'
  source: 成果元数据
  dictionary_ref: '9.1'
- key: form_no
  label: 表单编号
  required: true
  placeholder: '{{表单编号}}'
  source: 模板层扩展占位符
  dictionary_ref: T
- key: form_name
  label: 表单名称
  required: true
  placeholder: '{{表单名称}}'
  source: 模板层扩展占位符
  dictionary_ref: T
sections:
- order: 1
  id: header
  title: 表头
  fields:
  - agency
  - form_no
  - form_name
  - task_id
  - client
  - version
- order: 2
  id: self_eval
  title: 审核组自评
  fields:
  - audit_type
  - audit_time
  - lead
  - auditors
- order: 3
  id: client_feedback
  title: 委托人反馈
  fields:
  - client_rep
  - contact
  - date
artifacts:
- artifact_base: 预览
  artifact_format: md
  artifact_form: 简报
  relation: 简报附件（§11.1 第 12 类）；反馈内容由人填写，工具只落待填结构
note: 反馈内容由人填写，工具只落待填结构（§11.1 第 12 类）
sample_body: |-
  {{表单名称}}（表单编号：{{表单编号}}）
  {{认证机构名称}}　任务标识：{{任务标识}}　受审核方：{{受审核方名称}}
  审核类型：{{审核类型}}　审核时间：{{审核时间}}
  一、审核组自评：（待填）
  二、委托人反馈：（待填）　反馈人：{{委托方代表姓名}}／{{联系人姓名}}　日期：{{日期}}
