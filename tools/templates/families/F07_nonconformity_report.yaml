# 现场审核不符合报告（机构成果模板，Issue #19）
# 机构中立模板：本文件不含任何真实机构表单号、机构名或机构内部信息。
schema_version: 1
family_id: F07
name: 现场审核不符合报告
short_name: 不符合报告
aliases:
- f07_nonconformity_report
source_of_list: docs/spec/output-formats.md §11.1 第 7 类
form_number:
  placeholder: '{{表单编号}}'
  form_name_placeholder: '{{表单名称}}'
  registry_ref: FN-UICC-MS
  note: 本仓库只登记编号形态与来源出处，绝不写任何真实机构表单号
fields:
- key: task_id
  label: 任务标识
  required: true
  placeholder: '{{任务标识}}'
  source: 任务记录
  dictionary_ref: '9.1'
- key: agency
  label: 认证机构名称
  required: true
  placeholder: '{{认证机构名称}}'
  source: 机构档案（#20）
  dictionary_ref: '9.1'
- key: client
  label: 受审核方名称
  required: true
  placeholder: '{{受审核方名称}}'
  source: 委托人档案
  dictionary_ref: '9.1'
- key: nc_id
  label: 不符合编号
  required: true
  placeholder: '{{不符合编号}}'
  source: 不符合项序列
  dictionary_ref: T
- key: clause_no
  label: 条款号
  required: true
  placeholder: '{{条款号}}'
  source: 审核准则条款编号
  dictionary_ref: T
- key: clause_text_ref
  label: 条款引用
  required: true
  placeholder: '{{条款引用}}'
  source: 审核准则原文出处
  dictionary_ref: T
- key: fact_statement
  label: 事实陈述
  required: true
  placeholder: '{{事实陈述}}'
  source: 有锚点支撑的事实句
  dictionary_ref: T
- key: anchors
  label: 证据锚点
  required: true
  placeholder: '{{证据锚点}}'
  source: 锚点库 ID 列表
  dictionary_ref: T
- key: judgement_basis
  label: 判定依据
  required: true
  placeholder: '{{判定依据}}'
  source: 锚点逐句支撑说明
  dictionary_ref: T
- key: remediation_required
  label: 整改要求
  required: false
  placeholder: '{{整改要求}}'
  source: 不符合项闭环要求
  dictionary_ref: T
- key: due_date
  label: 完成时限
  required: false
  placeholder: '{{完成时限}}'
  source: '引用 #21 计算结果'
  dictionary_ref: T
- key: nc_category
  label: 不符合类别
  required: false
  placeholder: '{{不符合类别}}'
  source: 人工填写（G4 闸口）
  dictionary_ref: T
- key: nc_status
  label: 不符合状态
  required: false
  placeholder: '{{不符合状态}}'
  source: 开启或关闭状态
  dictionary_ref: T
- key: lead
  label: 审核组长姓名
  required: true
  placeholder: '{{审核组长姓名}}'
  source: 审核组信息
  dictionary_ref: '9.1'
- key: sign_date
  label: 签字日期
  required: false
  placeholder: '{{签字日期}}'
  source: 人工录入
  dictionary_ref: '9.1'
- key: version
  label: 版本号
  required: true
  placeholder: '{{版本号}}'
  source: 成果元数据
  dictionary_ref: '9.1'
- key: form_no
  label: 表单编号
  required: true
  placeholder: '{{表单编号}}'
  source: 模板层扩展占位符
  dictionary_ref: T
- key: form_name
  label: 表单名称
  required: true
  placeholder: '{{表单名称}}'
  source: 模板层扩展占位符
  dictionary_ref: T
sections:
- order: 1
  id: header
  title: 表头
  fields:
  - agency
  - form_no
  - form_name
  - task_id
  - client
- order: 2
  id: nc
  title: 不符合项
  fields:
  - nc_id
  - clause_no
  - clause_text_ref
  - fact_statement
  - anchors
  - judgement_basis
- order: 3
  id: remediation
  title: 整改
  fields:
  - remediation_required
  - due_date
  - nc_status
- order: 4
  id: sign
  title: 签署栏
  fields:
  - lead
  - sign_date
artifacts:
- artifact_base: 审核报告
  artifact_format: docx
  artifact_form: 报告类成果
  relation: 审核报告 §4.2 不符合项栏（§11.1 第 7 类）
- artifact_base: 过程底稿
  artifact_format: json
  artifact_form: 过程底稿
  relation: nonconformities 记录（§7.5）
note: category 留空由人填（#9 §8.3、G4 闸口）；事实句必须逐句可追到 confirmed 锚点
sample_body: |-
  {{表单名称}}（表单编号：{{表单编号}}）
  {{认证机构名称}}　任务标识：{{任务标识}}　受审核方：{{受审核方名称}}
  不符合编号：{{不符合编号}}　条款号：{{条款号}}　条款引用：{{条款引用}}
  事实陈述（逐句有锚点支撑）：{{事实陈述}}
  证据锚点：{{证据锚点}}
  判定依据：{{判定依据}}
  整改要求：{{整改要求}}　完成时限：{{完成时限}}
  不符合类别：{{不符合类别}}（工具不得预填，由有权限的分级人填写）
  状态：{{不符合状态}}
