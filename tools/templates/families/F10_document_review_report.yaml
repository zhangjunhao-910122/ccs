# 管理体系文件评审报告（机构成果模板，Issue #19）
# 机构中立模板：本文件不含任何真实机构表单号、机构名或机构内部信息。
schema_version: 1
family_id: F10
name: 管理体系文件评审报告
short_name: 文件评审报告
aliases:
- f10_document_review_report
source_of_list: docs/spec/output-formats.md §11.1 第 10 类
form_number:
  placeholder: '{{表单编号}}'
  form_name_placeholder: '{{表单名称}}'
  registry_ref: FN-UICC-MS
  note: 本仓库只登记编号形态与来源出处，绝不写任何真实机构表单号
fields:
- key: task_id
  label: 任务标识
  required: true
  placeholder: '{{任务标识}}'
  source: 任务记录
  dictionary_ref: '9.1'
- key: agency
  label: 认证机构名称
  required: true
  placeholder: '{{认证机构名称}}'
  source: 机构档案（#20）
  dictionary_ref: '9.1'
- key: client
  label: 受审核方名称
  required: true
  placeholder: '{{受审核方名称}}'
  source: 委托人档案
  dictionary_ref: '9.1'
- key: clause_no
  label: 条款号
  required: true
  placeholder: '{{条款号}}'
  source: 审核准则条款编号
  dictionary_ref: T
- key: clause_title
  label: 条款标题
  required: false
  placeholder: '{{条款标题}}'
  source: 审核准则条款标题
  dictionary_ref: T
- key: verdict
  label: 判定结论
  required: true
  placeholder: '{{判定结论}}'
  source: 判定枚举
  dictionary_ref: T
- key: anchors
  label: 证据锚点
  required: true
  placeholder: '{{证据锚点}}'
  source: 锚点库 ID 列表
  dictionary_ref: T
- key: gap_note
  label: 缺口说明
  required: false
  placeholder: '{{缺口说明}}'
  source: 文件评审缺口
  dictionary_ref: T
- key: reviewer
  label: 评审人
  required: true
  placeholder: '{{评审人}}'
  source: 审核组信息
  dictionary_ref: T
- key: review_state
  label: 确认状态
  required: false
  placeholder: '{{确认状态}}'
  source: 待确认或已确认
  dictionary_ref: T
- key: date
  label: 日期
  required: false
  placeholder: '{{日期}}'
  source: 任务时间
  dictionary_ref: '9.1'
- key: version
  label: 版本号
  required: true
  placeholder: '{{版本号}}'
  source: 成果元数据
  dictionary_ref: '9.1'
- key: form_no
  label: 表单编号
  required: true
  placeholder: '{{表单编号}}'
  source: 模板层扩展占位符
  dictionary_ref: T
- key: form_name
  label: 表单名称
  required: true
  placeholder: '{{表单名称}}'
  source: 模板层扩展占位符
  dictionary_ref: T
- key: signer
  label: 签字人姓名
  required: false
  placeholder: '{{签字人姓名}}'
  source: 人工录入
  dictionary_ref: '9.1'
- key: sign_date
  label: 签字日期
  required: false
  placeholder: '{{签字日期}}'
  source: 人工录入
  dictionary_ref: '9.1'
sections:
- order: 1
  id: header
  title: 表头
  fields:
  - agency
  - form_no
  - form_name
  - task_id
  - client
  - version
- order: 2
  id: rows
  title: 条款与文件评审结论
  fields:
  - clause_no
  - clause_title
  - verdict
  - anchors
  - gap_note
- order: 3
  id: sign
  title: 签署栏
  fields:
  - reviewer
  - signer
  - sign_date
artifacts:
- artifact_base: 条款-证据对照表
  artifact_format: xlsx
  artifact_form: 表格类成果
  relation: 对照表文件类锚点行（§11.1 第 10 类；§5.1 列定义）
- artifact_base: 过程底稿
  artifact_format: json
  artifact_form: 过程底稿
  relation: judgements 记录（§7.3）
note: 结论取判定枚举；不得出过程有效性结论（§11.1 第 10 类）
sample_body: |-
  {{表单名称}}（表单编号：{{表单编号}}）
  {{认证机构名称}}　任务标识：{{任务标识}}　受审核方：{{受审核方名称}}
  条款号：{{条款号}}　条款标题：{{条款标题}}
  结论：{{判定结论}}　锚点ID：{{证据锚点}}　缺口说明：{{缺口说明}}
  评审人：{{评审人}}　确认状态：{{确认状态}}　日期：{{日期}}　版本：{{版本号}}
