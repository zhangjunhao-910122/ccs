# 审核人员到达离开受审核方信息确认表（机构成果模板，Issue #19）
# 机构中立模板：本文件不含任何真实机构表单号、机构名或机构内部信息。
schema_version: 1
family_id: F11
name: 审核人员到达离开受审核方信息确认表
short_name: 到达离开确认表
aliases:
- f11_arrival_departure_confirmation
source_of_list: docs/spec/output-formats.md §11.1 第 11 类
form_number:
  placeholder: '{{表单编号}}'
  form_name_placeholder: '{{表单名称}}'
  registry_ref: FN-UICC-MS
  note: 本仓库只登记编号形态与来源出处，绝不写任何真实机构表单号
fields:
- key: task_id
  label: 任务标识
  required: true
  placeholder: '{{任务标识}}'
  source: 任务记录
  dictionary_ref: '9.1'
- key: agency
  label: 认证机构名称
  required: true
  placeholder: '{{认证机构名称}}'
  source: 机构档案（#20）
  dictionary_ref: '9.1'
- key: client
  label: 受审核方名称
  required: true
  placeholder: '{{受审核方名称}}'
  source: 委托人档案
  dictionary_ref: '9.1'
- key: client_addr
  label: 受审核方地址
  required: true
  placeholder: '{{受审核方地址}}'
  source: 委托人档案
  dictionary_ref: '9.1'
- key: auditors
  label: 审核员姓名
  required: true
  placeholder: '{{审核员姓名}}'
  source: 审核组信息
  dictionary_ref: '9.1'
- key: date_range
  label: 起止日期
  required: false
  placeholder: '{{起止日期}}'
  source: 审核方案
  dictionary_ref: '9.1'
- key: time
  label: 时间
  required: false
  placeholder: '{{时间}}'
  source: 任务时间
  dictionary_ref: '9.1'
- key: client_rep
  label: 委托方代表姓名
  required: false
  placeholder: '{{委托方代表姓名}}'
  source: 委托人档案
  dictionary_ref: '9.1'
- key: contact
  label: 联系人姓名
  required: false
  placeholder: '{{联系人姓名}}'
  source: 委托人档案
  dictionary_ref: '9.1'
- key: signer
  label: 签字人姓名
  required: false
  placeholder: '{{签字人姓名}}'
  source: 人工录入
  dictionary_ref: '9.1'
- key: sign_date
  label: 签字日期
  required: false
  placeholder: '{{签字日期}}'
  source: 人工录入
  dictionary_ref: '9.1'
- key: version
  label: 版本号
  required: true
  placeholder: '{{版本号}}'
  source: 成果元数据
  dictionary_ref: '9.1'
- key: form_no
  label: 表单编号
  required: true
  placeholder: '{{表单编号}}'
  source: 模板层扩展占位符
  dictionary_ref: T
- key: form_name
  label: 表单名称
  required: true
  placeholder: '{{表单名称}}'
  source: 模板层扩展占位符
  dictionary_ref: T
sections:
- order: 1
  id: header
  title: 表头
  fields:
  - agency
  - form_no
  - form_name
  - task_id
  - client
  - client_addr
- order: 2
  id: arrival
  title: 到达
  fields:
  - auditors
  - date_range
  - time
  - client_rep
- order: 3
  id: departure
  title: 离开
  fields:
  - auditors
  - date_range
  - time
  - contact
- order: 4
  id: sign
  title: 签署栏
  fields:
  - signer
  - sign_date
artifacts:
- artifact_base: 过程底稿
  artifact_format: json
  artifact_form: 过程底稿
  relation: 底稿 artifact 段（§11.1 第 11 类）
- artifact_base: 预览
  artifact_format: md
  artifact_form: 简报
  relation: 简报引用
sample_body: |-
  {{表单名称}}（表单编号：{{表单编号}}）
  {{认证机构名称}}　任务标识：{{任务标识}}　受审核方：{{受审核方名称}}（{{受审核方地址}}）
  审核人员：{{审核员姓名}}
  到达：{{起止日期}} {{时间}}　在场人员：{{委托方代表姓名}}
  离开：{{起止日期}} {{时间}}　联络人：{{联系人姓名}}
  确认签署：{{签字人姓名}}　{{签字日期}}　版本：{{版本号}}
