# 现场审核检查表（管理层）（机构成果模板，Issue #19）
# 机构中立模板：本文件不含任何真实机构表单号、机构名或机构内部信息。
schema_version: 1
family_id: F05
name: 现场审核检查表（管理层）
short_name: 检查表-管理层
aliases:
- f05_checklist_management
source_of_list: docs/spec/output-formats.md §11.1 第 5 类
form_number:
  placeholder: '{{表单编号}}'
  form_name_placeholder: '{{表单名称}}'
  registry_ref: FN-UICC-MS
  note: 本仓库只登记编号形态与来源出处，绝不写任何真实机构表单号
fields:
- key: task_id
  label: 任务标识
  required: true
  placeholder: '{{任务标识}}'
  source: 任务记录
  dictionary_ref: '9.1'
- key: agency
  label: 认证机构名称
  required: true
  placeholder: '{{认证机构名称}}'
  source: 机构档案（#20）
  dictionary_ref: '9.1'
- key: client
  label: 受审核方名称
  required: true
  placeholder: '{{受审核方名称}}'
  source: 委托人档案
  dictionary_ref: '9.1'
- key: dept
  label: 部门
  required: false
  placeholder: '{{部门}}'
  source: 审核方案
  dictionary_ref: '9.1'
- key: point_key
  label: 审核点编号
  required: true
  placeholder: '{{审核点编号}}'
  source: 判定记录 ID
  dictionary_ref: T
- key: clause_no
  label: 条款号
  required: true
  placeholder: '{{条款号}}'
  source: 审核准则条款编号
  dictionary_ref: T
- key: audit_question
  label: 审核问题
  required: true
  placeholder: '{{审核问题}}'
  source: 检查表问题列
  dictionary_ref: T
- key: verdict
  label: 判定结论
  required: true
  placeholder: '{{判定结论}}'
  source: 判定枚举
  dictionary_ref: T
- key: anchors
  label: 证据锚点
  required: true
  placeholder: '{{证据锚点}}'
  source: 锚点库 ID 列表
  dictionary_ref: T
- key: judgement_basis
  label: 判定依据
  required: true
  placeholder: '{{判定依据}}'
  source: 锚点逐句支撑说明
  dictionary_ref: T
- key: reviewer
  label: 评审人
  required: true
  placeholder: '{{评审人}}'
  source: 审核组信息
  dictionary_ref: T
- key: review_state
  label: 确认状态
  required: false
  placeholder: '{{确认状态}}'
  source: 待确认或已确认
  dictionary_ref: T
- key: version
  label: 版本号
  required: true
  placeholder: '{{版本号}}'
  source: 成果元数据
  dictionary_ref: '9.1'
- key: form_no
  label: 表单编号
  required: true
  placeholder: '{{表单编号}}'
  source: 模板层扩展占位符
  dictionary_ref: T
- key: form_name
  label: 表单名称
  required: true
  placeholder: '{{表单名称}}'
  source: 模板层扩展占位符
  dictionary_ref: T
- key: lead
  label: 审核组长姓名
  required: true
  placeholder: '{{审核组长姓名}}'
  source: 审核组信息
  dictionary_ref: '9.1'
- key: signer
  label: 签字人姓名
  required: false
  placeholder: '{{签字人姓名}}'
  source: 人工录入
  dictionary_ref: '9.1'
- key: sign_date
  label: 签字日期
  required: false
  placeholder: '{{签字日期}}'
  source: 人工录入
  dictionary_ref: '9.1'
sections:
- order: 1
  id: header
  title: 表头
  fields:
  - agency
  - form_no
  - form_name
  - task_id
  - client
  - dept
- order: 2
  id: rows
  title: 审核点记录
  fields:
  - point_key
  - clause_no
  - audit_question
  - verdict
  - anchors
  - judgement_basis
  - reviewer
  - review_state
- order: 3
  id: sign
  title: 签署栏
  fields:
  - lead
  - signer
  - sign_date
artifacts:
- artifact_base: 审查表
  artifact_format: xlsx
  artifact_form: 表格类成果
  relation: 审查表管理层范围行（§11.1 第 5 类；§4.1 列定义）
- artifact_base: 过程底稿
  artifact_format: json
  artifact_form: 过程底稿
  relation: judgements 记录（§7.3）
sample_body: |-
  {{表单名称}}（表单编号：{{表单编号}}）
  {{认证机构名称}}　任务标识：{{任务标识}}　受审核方：{{受审核方名称}}　部门：{{部门}}
  审核点 {{审核点编号}}　条款号 {{条款号}}
  审核问题：{{审核问题}}
  判定结论：{{判定结论}}　证据锚点：{{证据锚点}}
  判定依据：{{判定依据}}
  审核员确认：{{评审人}}　确认状态：{{确认状态}}
