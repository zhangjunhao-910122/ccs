# ---------------------------------------------------------------------------
# 工具约定（CNCA 规则未规定细则，此处显式声明，不冒充规则数值）
# ---------------------------------------------------------------------------
conventions:
  calendar_month:
    value: true
    note: "期限按日历月处理（不按 30 天折算）；月份加减时目标月无对应日则收敛到该月最后一天（如 1 月 31 日 + 1 个月 = 2 月 28 日）。"
    source_ref: "工具约定（CNCA 规则未规定期间计算细则）"
    verified: false
    blocking: false
    class: tool_convention
  start_day_counted:
    value: false
    note: "起算当日不计入期限，期限自次日起算。"
    source_ref: "工具约定（CNCA 规则未规定期间计算细则）"
    verified: false
    blocking: false
    class: tool_convention
  deadline_day_included:
    value: true
    note: "届满当日算届满：在届满日当日 24:00 前完成即视为在期限内（临界值按合规判定）。"
    source_ref: "工具约定（CNCA 规则未规定期间计算细则）"
    verified: false
    blocking: false
    class: tool_convention
  half_man_day_rounding:
    step: 0.5
    tie: "half_up"
    note: "人日计算结果有小数的，宜调整为最接近的半人日数（5.3→5.5，5.2→5.0）；正好居中时向上取（5.25→5.5）。"
    source_ref: "CNCA-QMS-01:2025 5.4.2.3 / CNCA-EMS-01:2026 5.4.2.3 / CNCA-OHSMS-01:2026 5.4.2.3"
    md_ref: "md §3.3"
    verified: true
  site_allocation:
    note: "分场所人日按「总人日 ÷ 抽样场所数」分配后取最接近的半人日；分配合计可能与总人日有差额，差额单列。"
    source_ref: "工具约定（规则只要求按 5.4.2 逐场所确定，见 5.4.3.5）"
    verified: false
    blocking: false
    class: tool_convention
