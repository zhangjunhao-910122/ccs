# CNCA 三体系 人日 / 抽样比例 / 期限 参数表
# ---------------------------------------------------------------------------
# 唯一数值来源：docs/research/multi-system-audit-research.md（数值落地笔记）
#   + 其指向的一手规则全文 .research-tmp/CNCA-*-cct.txt（附录 B 完整表）
# 规则：代码不内嵌任何规则数值，一律读本表；本表里没有的数值不得猜。
#
# 字段约定
#   value / days : 数值
#   source_ref   : CNCA 条款号（+ 附录 B 行号），可追溯到规则原文
#   md_ref       : multi-system-audit-research.md 中同时载有该数值的章节
#                  （null = 该数值只由一手规则原文核验，md 未列）
#   verified     : true/false；false 且 blocking=true 时，调用方必须报「参数待核」
#   blocking     : false 表示该项是工具约定或提示性缺口，不阻断计算
# ---------------------------------------------------------------------------

meta:
  schema_version: 1
  title: CNCA 三体系 人日/抽样/期限 参数表
  generated: "2026-11-05"
  primary_sources:
    qms: ".research-tmp/CNCA-QMS-01-2025_cct.txt"
    ems: ".research-tmp/CNCA-EMS-01-2026_cct.txt"
    ohsms: ".research-tmp/CNCA-OHSMS-01-2026_cct.txt"
  notes:
    - "附录 B 三张表的完整数值不在 md 里（md 只列节选），按 md §5 与 §10-1 的指引从一手规则原文解析后写入本表。"
    - "md 已列出的行用 md_ref 标注，可逐行与一手原文互校。"
    - "条款号按 2025/2026 版新编号（md §7 映射表）；5.10 段 QMS 为 5.10.3/5.10.4，EMS/OHSMS 为 5.10.4/5.10.5。"
  verification_policy:
    # true = 一手规则原文已核验的行，即使 md 未列，也视为已核验；
    # false = 只承认 md 载有的行，其余一律按「参数待核」处理。
    allow_primary_source_only: true
  rule_clause_map:
    qms:   {nc_verification: "5.10.3", no_decision: "5.10.4"}
    ems:   {nc_verification: "5.10.4", no_decision: "5.10.5"}
    ohsms: {nc_verification: "5.10.4", no_decision: "5.10.5"}

